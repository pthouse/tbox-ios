name: build-app

# 全链：runtime（带缓存）→ 换 TBox 壳 → xcodegen → xcodebuild → 未签名 ipa
on:
  workflow_dispatch:
    inputs:
      skip_runtime:
        description: '跳过 runtime（已有缓存时用）'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 400
    steps:
      - name: 拉上游源码
        uses: actions/checkout@v4
        with:
          repository: jo32/tvbox-silicon
          path: src

      - name: 恢复 runtime 缓存
        id: rt-cache
        uses: actions/cache@v4
        with:
          path: |
            src/build/AppleRuntime
            src/build/ApplePython
          key: apple-runtime-v2-${{ hashFiles('src/Scripts/*.sh') }}
          restore-keys: |
            apple-runtime-v2-

      - name: 环境
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          df -h /
          echo "cache-hit=${{ steps.rt-cache.outputs.cache-hit }}"

      - name: 装依赖
        run: |
          chmod +x src/Scripts/*.sh
          brew install autoconf automake cmake xcodegen python@3.14 maven 2>&1 | tail -4 || true

      # ── runtime（有缓存就整段跳过）─────────────────
      - name: R1 java-host
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        run: cd src && ./Scripts/build-java-host.sh 2>&1 | tail -20
      - name: R2 libffi
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        run: cd src && ./Scripts/build-apple-libffi.sh ios 2>&1 | tail -10
      - name: R3 OpenJDK Zero
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 120
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/build-apple-jvm.sh ios 2>&1 | tail -40
      - name: R4 unicorn
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/build-apple-interpreter.sh ios 2>&1 | tail -20
      - name: R5 native bindings
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 90
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/build-apple-native-bindings.sh ios 2>&1 | tail -30
      - name: R6 ffmpeg
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 90
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/build-apple-ffmpeg.sh ios 2>&1 | tail -20
      - name: R7 libass
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/build-apple-libass.sh ios 2>&1 | tail -20
      - name: R8 package runtime
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 150
        run: cd src && JOBS=$(sysctl -n hw.ncpu) ./Scripts/package-apple-runtime.sh ios 2>&1 | tail -30
      - name: R9 python
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 60
        run: |
          cd src
          export HOST_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          ./Scripts/build-apple-python.sh ios 2>&1 | tail -20
      - name: R10 python wheels
        if: steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        timeout-minutes: 60
        run: |
          cd src
          export HOST_PYTHON="$(brew --prefix python@3.14)/bin/python3.14"
          ./Scripts/build-apple-python-wheels.sh ios 2>&1 | tail -20

      - name: 核对 runtime
        run: |
          test -f src/build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a
          du -h src/build/AppleRuntime/iphoneos/lib/libTVAppleRuntime.a
          du -sh src/build/AppleRuntime/iphoneos

      # actions/cache 的保存阶段只在 job 成功时执行，失败轮次从不落盘。
      # 用独立 save 步骤 + always()，把 R1–R10 的产物固化下来，后续轮次整段跳过。
      - name: 保存 runtime 缓存
        if: always() && steps.rt-cache.outputs.cache-hit != 'true' && inputs.skip_runtime != true
        uses: actions/cache/save@v4
        with:
          path: |
            src/build/AppleRuntime
            src/build/ApplePython
          key: apple-runtime-v2-${{ hashFiles('src/Scripts/*.sh') }}

      # 上游仓库里这几处是软链接，Windows 中转后变成普通文件，必须重建
      - name: 重建软链接
        run: |
          cd src
          rm -rf Packages/TVCore Vendor/FFmpeg Vendor/LibASS
          ln -sfn .. Packages/TVCore
          ln -sfn ../build/FFmpeg Vendor/FFmpeg
          ln -sfn ../build/LibASS Vendor/LibASS
          ls -l Packages TVCore 2>/dev/null || true
          ls -l Vendor | head -10
          test -d Packages/TVCore/App
          test -d Vendor/FFmpeg/FFmpeg.xcframework
          test -d Vendor/LibASS/LibASS.xcframework
          echo "symlinks ok"

      # 上游 ScriptSniffing.swift 在 Swift 6 下报 "closure captures 'sites' before it is declared"
      - name: 补丁 Swift 6 严格检查
        run: |
          python3 - <<'PY'
          import io
          p = 'src/Sources/TVCore/ScriptSniffing.swift'
          s = io.open(p, encoding='utf-8').read()
          old = "        let pending = sites.indices.filter { sites[$0].needsSniffing }\n        guard !pending.isEmpty else { return self }\n        var sites = sites\n"
          new = "        var sites = sites\n        let pending = sites.indices.filter { sites[$0].needsSniffing }\n        guard !pending.isEmpty else { return self }\n"
          assert old in s, 'ScriptSniffing pattern not found'
          io.open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('patched ScriptSniffing.swift')

          # VideoEnhancement: SDK 未暴露 VT 私有查询，直接回退
          p = 'src/App/VideoEnhancement.swift'
          s = io.open(p, encoding='utf-8').read()
          i = s.find('private static let interpolationLimit:')
          assert i >= 0, 'interpolationLimit not found'
          j = s.find('}()', i) + 3
          repl = ('    private static let interpolationLimit: (side: Int, pixels: Int)? = {\n'
                  '        return nil\n'
                  '    }()')
          io.open(p, 'w', encoding='utf-8').write(s[:i] + repl + s[j:])
          print('patched VideoEnhancement.swift')

          # LiveRoomsView: Result(catching:) 在 Swift 6 下推不出同步闭包
          p = 'src/App/LiveRoomsView.swift'
          s = io.open(p, encoding='utf-8').read()
          old = '                    group.addTask { await (platform, Result { try await LiveCatalog.search(platform, keyword: query) }) }'
          new = ('                    group.addTask {\n'
                 '                        do { return (platform, .success(try await LiveCatalog.search(platform, keyword: query))) }\n'
                 '                        catch { return (platform, .failure(error)) }\n'
                 '                    }')
          assert old in s, 'LiveRoomsView pattern not found'
          io.open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('patched LiveRoomsView.swift')

          # 上游代码库整体按 Swift 5 语言模式编写；Xcode 26 的严格并发检查
          # 会在 @State mutating 访问器、闭包捕获等处误报，退回 5.0 语言模式。
          p = 'src/project.yml'
          s = io.open(p, encoding='utf-8').read()
          old = "SWIFT_VERSION: '6.0'"
          assert old in s, 'SWIFT_VERSION not found'
          s = s.replace(old, "SWIFT_VERSION: '5.0'", 1)
          s = s.replace('OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-dynamic-actor-isolation',
                        'OTHER_SWIFT_FLAGS: $(inherited)', 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('patched project.yml -> SWIFT_VERSION 5.0')

          # LivePluginOfferSection 有 private @State，合成的 memberwise init 降级为
          # private，外部无法构造；显式补一个 internal init。
          p = 'src/App/LivePluginsView.swift'
          s = io.open(p, encoding='utf-8').read()
          old = '    @State private var previews: [String: URL] = [:]\n'
          new = ('    @State private var previews: [String: URL] = [:]\n\n'
                 '    init(title: String, address: URL, entries: [LivePlugins.Entry]) {\n'
                 '        self.title = title\n'
                 '        self.address = address\n'
                 '        self.entries = entries\n'
                 '    }\n')
          assert old in s, 'LivePluginOfferSection previews not found'
          io.open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('patched LivePluginsView.swift init')

          # @State 的部分修改（insert/remove/subscript/+=）要走 _modify 访问器，
          # Swift 6.2 在 nonmutating 方法与 escaping 闭包中不允许；改为一律整体赋值，
          # 走 @State 的 nonmutating set。
          p = 'src/App/LivePluginsView.swift'
          s = io.open(p, encoding='utf-8').read()
          old = (
              '        list.forEach { busy.insert($0.pluginId); failures[$0.pluginId] = nil }\n'
              '        Task {\n'
              '            // One after another: a failure leaves the rest to install.\n'
              '            for entry in list {\n'
              '                do { try await LivePlugins.shared.install(entry, from: address) }\n'
              '                catch { failures[entry.pluginId] = error.localizedDescription }\n'
              '                busy.remove(entry.pluginId)\n'
              '                revision += 1\n'
              '            }\n'
              '        }\n'
          )
          new = (
              '        busy = busy.union(Set(list.map(\\.pluginId)))\n'
              '        var cleared = failures\n'
              '        for entry in list { cleared[entry.pluginId] = nil }\n'
              '        failures = cleared\n'
              '        Task {\n'
              '            // One after another: a failure leaves the rest to install.\n'
              '            for entry in list {\n'
              '                do { try await LivePlugins.shared.install(entry, from: address) }\n'
              '                catch {\n'
              '                    var next = failures\n'
              '                    next[entry.pluginId] = error.localizedDescription\n'
              '                    failures = next\n'
              '                }\n'
              '                busy = busy.subtracting([entry.pluginId])\n'
              '                revision = revision + 1\n'
              '            }\n'
              '        }\n'
          )
          assert old in s, 'install() body not found'
          io.open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('patched LivePluginsView.swift install()')
          PY

      # ── 换成 TBox 的壳 ─────────────────────────────
      - name: 拉换壳脚本
        uses: actions/checkout@v4
        with:
          repository: pthouse/tbox-ios
          path: tools
          sparse-checkout: |
            scripts

      - name: 品牌换壳
        run: python3 tools/scripts/tbox-rebrand.py src

      - name: 生成 Xcode 工程
        run: cd src && xcodegen generate 2>&1 | tail -20

      # ── 编 app ─────────────────────────────────────
      - name: xcodebuild
        timeout-minutes: 90
        run: |
          set -o pipefail
          cd src
          xcodebuild \
            -project TVBox.xcodeproj \
            -scheme TVBox-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -60

      - name: 打未签名 ipa
        run: |
          set -eu
          APP=$(find src/build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          test -d "$APP"
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/tbox-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/tbox-unsigned.ipa"

      - name: 产物清单
        if: always()
        run: |
          ls -la src/build/dd/Build/Products/Release-iphoneos 2>/dev/null | head -20 || echo '(no products)'
          tail -80 /tmp/xcodebuild.log 2>/dev/null || echo '(no xcodebuild log)'

      - name: 上传 ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbox-ipa
          path: |
            tbox-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: 上传 xcodebuild 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
